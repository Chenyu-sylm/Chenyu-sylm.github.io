  /* ===== 首页文章卡片化 =====
     只作用于首页 .content.index；文章页/归档页保持原布局。
     布局：标题（左）→ 摘要+阅读全文 → 底部小字（日期·分类）+ 标签 */
  .content.index .post-block {
    background: #f6f6f6;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 18px 22px 16px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
    display: flex;
    flex-direction: column;
    transition: box-shadow .25s ease, border-color .25s ease, transform .25s ease;
  }
  .content.index .post-block:hover {
    box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
    border-color: #c9d1d9;
    transform: translateY(-2px);
  }
  .content.index .post-block:last-child { margin-bottom: 0; }

  /* 把标题（顶部）和 meta（底部）拆开：header 不占盒子，
     标题/正文/日期分类/标签直接参与卡片的纵向弹性排列 */
  .content.index .post-header { display: contents; }
  .content.index .post-title { order: 1; text-align: left; margin-bottom: 6px; font-size: 18px; font-weight: 700; }
  .content.index .post-body { order: 2; font-size: 14px; }
  .content.index .post-meta { order: 3; }
  .content.index .post-footer { order: 4; }

  /* 底部小字：日期、分类（去掉图标和"发表于/分类于"文字，只留值和分隔线） */
  .content.index .post-meta {
    text-align: left;
    font-size: 13px;
    margin: 12px 0 0;
  }
  .content.index .post-meta .post-meta-item-icon,
  .content.index .post-meta .post-meta-item-text { display: none; }
  /* 底部只留「日历+日期」「箱子+分类」两个带图标的值，"发表于/分类于"文字去掉 */
  .content.index .post-meta .post-meta-item:first-child .post-meta-item-icon,
  .content.index .post-meta .post-meta-item:has(.fa-folder) .post-meta-item-icon {
    display: inline-block;
    margin-right: 3px;
  }
  .content.index .post-meta > .post-meta-item > .post-meta-item-icon { font-size: 12px; }
  /* 卡片只保留一个日期：隐藏主题的"编辑于"项（fa-calendar-check），只留发表日期 */
  .content.index .post-meta .post-meta-item:has(.fa-calendar-check) { display: none; }
  /* 分类图标：把文件夹替换成 fa-box（箱子），实心字形 */
  .content.index .post-meta .fa-folder {
    display: inline-block;
    font-family: "Font Awesome 5 Free";
    font-weight: 900;
  }
  .content.index .post-meta .fa-folder::before { content: "\f468"; }

  /* 阅读全文做成小号文字链接，不再占居中大按钮（摘要与按钮间距收紧） */
  .content.index .post-body > p { margin-bottom: 0; }
  .content.index .post-button { margin-top: 6px; text-align: left; }
  .content.index .post-button .btn {
    padding: 0;
    border: none;
    background: transparent;
    color: #0969da;
    font-size: 13px;
  }
  .content.index .post-button .btn:hover { background: transparent; color: #0550ae; }

  /* 隐藏原来分隔文章的省略号横线；卡片底部的标签行 */
  .content.index .post-eof { display: none; }
  .content.index .post-footer .post-tags {
    margin: 8px 0 0;
    text-align: left; /* 覆盖主题 .posts-expand .post-tags 的居中 */
    font-size: 13px;
  }
  /* 标签不框起来：纯文字、靠左排列 */
  .content.index .post-footer .post-tags a {
    margin: 0 14px 0 0;
    color: #57606a;
    text-decoration: none;
    transition: color .2s ease;
  }
  .content.index .post-footer .post-tags a:hover { color: #0969da; }
  /* 标签图标小一号，跟文字保持同基线 */
  .content.index .post-footer .post-tags a i {
    font-size: 11px;
    margin-right: 3px;
  }

  @media (prefers-color-scheme: dark) {
    /* 用户要求卡片统一米白浅色，深色模式下也保持浅卡 + 卡片内深色文字才能看清 */
    .content.index .post-block {
      background: #f6f6f6;
      border-color: #dcdcdc;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
    }
    .content.index .post-block:hover {
      border-color: #cfcfcf;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
    }
    .content.index .post-title-link { color: #1f2328; }
    .content.index .post-body { color: #373d44; }
    .content.index .post-meta { color: #57606a; }
    .content.index .post-button .btn { color: #0969da; }
    .content.index .post-button .btn:hover { color: #0550ae; }
    .content.index .post-footer .post-tags a { color: #57606a; }
    .content.index .post-footer .post-tags a:hover { color: #0969da; }
  }

  /* ===== 文章页：标签显示在标题/日期下方另起一行（不再放文末）
     对应 themes/next/layout/_macro/post.swig 中的本地改动（标签移入 post-header） */
  .content.post .post-header .post-meta { margin-bottom: 18px; }
  .content.post .post-header .post-tags {
    margin: 0 0 26px;
    text-align: center;
  }
  .content.post .post-header .post-tags a { margin: 0 10px; }

  /* ===== 移动端（<992px）目录入口 =====
     Pisces 在 <992px 把 .sidebar 和 .sidebar-toggle 无条件 display:none
     （themes/next/source/css/_schemes/Pisces/_sidebar.styl:8-9 与 :13-14），
     而滑出逻辑只写在 Muse 方案里（themes/next/source/js/schemes/muse.js），
     所以主题配置 sidebar.onmobile 对 Pisces 不起作用，这里自己补入口和抽屉。 */
  @media (max-width: 991px) {
    .sidebar-toggle { display: block !important; }
    body.cb-sidebar-open .sidebar {
      display: block !important;
      position: fixed !important;
      top: 0;
      left: 0;
      bottom: 0;
      width: 300px;
      max-width: 86vw;
      margin-top: 0 !important;
      padding: 14px 10px 46px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1250;
      box-shadow: 2px 0 14px rgba(0, 0, 0, .45);
    }
    /* Affix 会把 .sidebar-inner 设成 fixed，抽屉里必须回到普通流 */
    body.cb-sidebar-open .sidebar .sidebar-inner {
      position: static !important;
      top: auto !important;
      width: auto !important;
      transform: none !important;
    }
    /* motion 过渡依赖元素可见性：Pisces 把 .sidebar-inner 设成 opacity:0，
       而 js/motion.js 的侧栏动画只在桌面路径上触发，抽屉里必须自己点亮的元素 */
    body.cb-sidebar-open .sidebar .sidebar-inner,
    body.cb-sidebar-open .sidebar .motion-element { opacity: 1 !important; }
    body.cb-sidebar-open::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 1200;
    }
  }

<script>
  window.addEventListener('tabs:register', () => {
    let { activeClass } = CONFIG.comments;
    if (CONFIG.comments.storage) {
      activeClass = localStorage.getItem('comments_active') || activeClass;
    }
    if (activeClass) {
      let activeTab = document.querySelector(`a[href="#comment-${activeClass}"]`);
      if (activeTab) {
        activeTab.click();
      }
    }
  });
  if (CONFIG.comments.storage) {
    window.addEventListener('tabs:click', event => {
      if (!event.target.matches('.tabs-comment .tab-content .tab-pane')) return;
      let commentClass = event.target.classList[1];
      localStorage.setItem('comments_active', commentClass);
    });
  }
</script>

              const display = !!node.type.match(/; *mode=display/);
              const math = new doc.options.MathItem(node.textContent, doc.inputJax[0], display);
              const text = document.createTextNode('');

<script>
  (function () {
    // 超过该行数的代码块默认折叠，短块直接展开
    var FOLD_THRESHOLD = 12;

    // Hexo 把每行输出成 inline <span class="line">，innerText 不会在 inline 元素间插入换行，
    // 直接取 innerText 会把整个多行代码块粘成一行。必须逐行取 textContent。
    function extractCode(figure) {
      var codeEl = figure.querySelector('.code') || figure.querySelector('pre') || figure;
      var lines = codeEl.querySelectorAll('.line');
      if (lines.length) {
        var out = [];
        for (var i = 0; i < lines.length; i++) out.push(lines[i].textContent);
        return out.join('\n');
      }
      return codeEl.innerText;
    }

    function lineCount(figure) {
      var codeEl = figure.querySelector('.code') || figure.querySelector('pre');
      if (!codeEl) return 0;
      var lines = codeEl.querySelectorAll('.line');
      return lines.length ? lines.length : codeEl.innerText.split('\n').length;
    }

    function langLabel(figure) {
      var lang = '';
      figure.classList.forEach(function (c) {
        if (c && c !== 'highlight' && !lang) lang = c;
      });
      if (!lang || lang === 'plaintext') return 'text';
      return lang;
    }

    function setCollapsed(wrapper, collapsed) {
      wrapper.classList.toggle('cb-collapsed', collapsed);
      var btn = wrapper.querySelector('.cb-fold');
      if (btn) btn.textContent = collapsed ? '展开' : '折叠';
    }

    function allWrappers() {
      return Array.prototype.slice.call(document.querySelectorAll('.post-body .cb-enhanced'));
    }

    function syncGlobalBtn() {
      var btn = document.querySelector('.cb-global');
      if (!btn) return;
      var anyExpanded = allWrappers().some(function (w) { return !w.classList.contains('cb-collapsed'); });
      btn.textContent = anyExpanded ? '全部折叠' : '全部展开';
    }

    function addGlobalToggle(body) {
      if (!body.querySelector('.cb-toolbar')) {
        var toolbar = document.createElement('div');
        toolbar.className = 'cb-toolbar';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cb-btn cb-global';
        btn.addEventListener('click', function () {
          var collapse = btn.textContent === '全部折叠';
          allWrappers().forEach(function (w) { setCollapsed(w, collapse); });
          syncGlobalBtn();
        });
        toolbar.appendChild(btn);
        body.insertBefore(toolbar, body.firstChild);
      }
      syncGlobalBtn();
    }

    function enhance() {
      var body = document.querySelector('.post-body');
      if (!body) return;

      body.querySelectorAll('figure.highlight').forEach(function (figure) {
        if (figure.parentNode.classList.contains('cb-enhanced')) return;

        var wrapper = document.createElement('div');
        wrapper.className = 'cb-enhanced';
        figure.parentNode.insertBefore(wrapper, figure);

        var header = document.createElement('div');
        header.className = 'cb-header';

        var langSpan = document.createElement('span');
        langSpan.className = 'cb-lang';
        langSpan.textContent = langLabel(figure);

        var actions = document.createElement('div');
        actions.className = 'cb-actions';

        var copyBtn = document.createElement('button');
        copyBtn.className = 'cb-btn cb-copy';
        copyBtn.type = 'button';
        copyBtn.textContent = '复制';
        copyBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          copyText(extractCode(figure), copyBtn);
        });

        var foldBtn = document.createElement('button');
        foldBtn.className = 'cb-btn cb-fold';
        foldBtn.type = 'button';
        foldBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          setCollapsed(wrapper, !wrapper.classList.contains('cb-collapsed'));
          syncGlobalBtn();
        });

        actions.appendChild(copyBtn);
        actions.appendChild(foldBtn);
        header.appendChild(langSpan);
        header.appendChild(actions);
        wrapper.appendChild(header);
        wrapper.appendChild(figure);

        setCollapsed(wrapper, lineCount(figure) > FOLD_THRESHOLD);
      });

      if (body.querySelector('.cb-enhanced')) addGlobalToggle(body);
    }

    function copyText(text, btn) {
      var restore = function () { btn.textContent = '复制'; };
      var done = function () { btn.textContent = '已复制'; setTimeout(restore, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); });
      } else {
        fallback(text, done);
      }
    }

    function fallback(text, done) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }

    function init() { enhance(); }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    document.addEventListener('pjax:complete', init);
  })();
</script>

<script>
  (function () {
    // 主题自带的 theme.mermaid 在 DOMContentLoaded 之后注入时不会自动 init（它依赖 mermaid
    // 内部的 startOnLoad），所以这里保持 theme.mermaid.enable: false，自己显式渲染。
    var MERMAID_SRC = 'https://cdn.jsdelivr.net/npm/mermaid@9/dist/mermaid.min.js';
    var loading = false;

    function render(nodes) {
      var m = window.mermaid;
      if (!m) return;
      m.initialize({
        startOnLoad: false,
        theme: 'forest',
        // 图标签里的 <br/> 换行需要 loose，strict 会被当作文本
        securityLevel: 'loose',
        flowchart: { curve: 'linear' }
      });

      // 源码从 data-graph 属性读，不要读 textContent：textContent 是可见文本，
      // 在页面初始化阶段会被页面上遍历文本节点的脚本改写（实测 Q[" 变成 Q ["），
      // 改写完就解析失败了。属性值不是文本节点，不受影响。
      nodes.forEach(function (el, i) {
        if (el.getAttribute('data-processed') || el.getAttribute('data-mm-tried')) return;
        var code = el.getAttribute('data-graph') || el.textContent;
        if (!code) return;
        el.setAttribute('data-mm-tried', '1');
        var id = 'mermaid-' + Date.now() + '-' + i;
        var task = m.renderAsync
          ? m.renderAsync(id, code)
          : new Promise(function (resolve, reject) { m.render(id, code, resolve, reject); });
        task.then(function (svg) {
          el.innerHTML = svg;
          el.setAttribute('data-processed', 'true');
        }).catch(function () {
          // 解析失败：保留源码文本，由 head.swig 的降级样式按等宽源码显示
          el.removeAttribute('data-mm-tried');
        });
      });
    }

    function scan() {
      var nodes = Array.prototype.slice.call(document.querySelectorAll('.post-body div.mermaid'));
      if (!nodes.length) return;
      if (window.mermaid) { render(nodes); return; }
      if (loading) return;
      loading = true;
      var s = document.createElement('script');
      s.src = MERMAID_SRC;
      s.onload = function () { render(nodes); };
      // 加载失败时不处理：未渲染的 div 由 head.swig 的样式降级成等宽源码显示
      s.onerror = function () { loading = false; };
      document.head.appendChild(s);
    }

    function init() { scan(); }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    document.addEventListener('pjax:complete', init);
  })();
</script>

<script>
  (function () {
    // NexT 模板只给 .sidebar-nav-toc 加了 sidebar-nav-active，却没给对应面板加
    // sidebar-panel-active，而 sidebar-nav.styl:33 的 .sidebar-panel { display: none }
    // 是无条件的 —— 所以目录面板在任何宽度下初始都是隐藏的，必须点一次别的 tab
    // 再点回来才出来。这里按当前激活 tab 的下标补齐（tab 与 panel 顺序一一对应）。
    function activateDefaultPanel() {
      var panels = document.querySelectorAll('.sidebar-panel');
      if (!panels.length || document.querySelector('.sidebar-panel-active')) return;
      var activeTab = document.querySelector('.sidebar-nav li.sidebar-nav-active');
      var idx = activeTab ? Array.prototype.indexOf.call(activeTab.parentNode.children, activeTab) : 0;
      if (!(idx >= 0) || idx >= panels.length) idx = 0;
      for (var i = 0; i < panels.length; i++) {
        panels[i].classList.toggle('sidebar-panel-active', i === idx);
      }
    }

    // 目录条目被 CSS 截断后，被省略的部分只能靠原生 tooltip 看到；
    // Hexo 的 TOC helper 不输出 title，这里补上（样式见 head.swig 的 .post-toc 段）。
    function addTocTitles() {
      var links = document.querySelectorAll('.post-toc .nav-link');
      for (var i = 0; i < links.length; i++) {
        var text = links[i].querySelector('.nav-text');
        if (!text || links[i].hasAttribute('title')) continue;
        links[i].setAttribute('title', text.textContent.trim());
      }
    }

    // Pisces 方案没有移动端侧栏 JS（滑出逻辑只在 js/schemes/muse.js 里），
    // 汉堡按钮的开合得自己接上，样式见 head.swig 的 .cb-sidebar-open 段。
    function initSidebarToggle() {
      var toggle = document.querySelector('.sidebar-toggle');
      var sidebar = document.querySelector('.sidebar');
      if (!toggle || !sidebar || toggle.dataset.cbBound) return;
      toggle.dataset.cbBound = '1';

      function isOpen() { return document.body.classList.contains('cb-sidebar-open'); }
      function close() { document.body.classList.remove('cb-sidebar-open'); }
      function open() {
        activateDefaultPanel();
        document.body.classList.add('cb-sidebar-open');
      }

      toggle.addEventListener('click', function () { isOpen() ? close() : open(); });

      document.addEventListener('click', function (e) {
        if (!isOpen() || toggle.contains(e.target)) return;
        if (sidebar.contains(e.target)) {
          // 手机上点了目录条目要收起抽屉，但不能同步收：链接面板一旦变成
          // display:none，浏览器就不执行这次的 #锚点 跳转（实测 scrollY 和 hash 都不动）。
          if (e.target.closest && e.target.closest('a[href^="#"]')) setTimeout(close, 0);
          return;
        }
        close();
      });

      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
      window.addEventListener('resize', function () { if (window.innerWidth >= 992) close(); });
    }

    function init() { activateDefaultPanel(); addTocTitles(); initSidebarToggle(); }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    document.addEventListener('pjax:complete', init);
  })();
</script>
